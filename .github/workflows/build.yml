name: Build APK ARDAN VARIASI MOTOR

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil project
        uses: actions/checkout@v4

      - name: Siapkan Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Ekstrak project ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)
          echo "ZIP ditemukan: $ZIP"
          mkdir -p project
          unzip -o "$ZIP" -d project

      - name: Cari folder project Gradle
        run: |
          echo "Mencari settings.gradle..."
          find project -name "settings.gradle" -o -name "settings.gradle.kts"

      - name: Tentukan folder project
        run: |
          ROOT=$(dirname "$(find project -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1)")
          echo "GRADLE_ROOT=$ROOT" >> $GITHUB_ENV
          echo "Project Gradle: $ROOT"

      - name: Build APK
        run: |
          cd "$GRADLE_ROOT"
          gradle assembleDebug --no-daemon

      - name: Siapkan nama APK
        run: |
          mkdir -p release
          cp "$GRADLE_ROOT/app/build/outputs/apk/debug/app-debug.apk" \
             release/ARDAN-VARIASI-MOTOR.apk

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: ARDAN-VARIASI-MOTOR
          path: release/ARDAN-VARIASI-MOTOR.apk
          retention-days: 30
