name: Build APK ARDAN VARIASI MOTOR

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil project
        uses: actions/checkout@v4

      - name: Siapkan Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Ekstrak project ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)
          echo "ZIP ditemukan: $ZIP"
          mkdir -p project
          unzip -o "$ZIP" -d project
          cp -r project/. .

      - name: Build APK
        run: |
          gradle assembleDebug --no-daemon

      - name: Siapkan nama APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk \
             release/ARDAN-VARIASI-MOTOR.apk

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: ARDAN-VARIASI-MOTOR
          path: release/ARDAN-VARIASI-MOTOR.apk
          retention-days: 30
